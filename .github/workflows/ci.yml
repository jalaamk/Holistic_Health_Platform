name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint check
        run: npm run lint
      
      - name: Type check
        run: npm run type-check
      
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project-id
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID: test-app-id
          FIREBASE_ADMIN_PROJECT_ID: test-project-id
          FIREBASE_ADMIN_CLIENT_EMAIL: test@test-project.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nTEST_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
      
      - name: Test
        run: npm test
